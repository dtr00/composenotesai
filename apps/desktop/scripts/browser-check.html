<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Browser checks</title>
  </head>
  <body>
    <pre id="results">Running browser checks...</pre>
    <script type="module">
      const tests = {
        "ai-drawing": () => import("./ai-drawing.browser-test.ts").then((test) => test.testAiDrawings()),
        "drawing-vision": () => import("./drawing-vision.browser-test.ts").then((test) => test.testDrawingVision()),
        excalidraw: () => import("./excalidraw.browser-test.ts").then((test) => test.testExcalidrawEditor()),
        "new-tab": () => import("./new-tab.browser-test.ts").then((test) => test.testNewTabActions()),
        "note-navigation": () => import("./note-navigation.browser-test.ts").then((test) => test.testNoteNavigation()),
        "storage-usage": () => import("./storage-usage.browser-test.ts").then((test) => test.testStorageUsage()),
      };
      const results = document.getElementById("results");
      const name = new URLSearchParams(location.search).get("test");
      const run = tests[name];
      if (!run) results.textContent = `FAIL: Choose a check with ?test=${Object.keys(tests).join(", ?test=")}`;
      else
        run().then(
          (passed) => {
            results.textContent = passed.map((check) => `PASS: ${check}`).join("\n");
          },
          (error) => {
            results.textContent = `FAIL: ${error.stack}`;
          },
        );
    </script>
  </body>
</html>
